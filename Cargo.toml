# gitoxide — LOCAL DIVERGED FORK, library crates only.
#
# This fork has permanently diverged from GitoxideLabs/gitoxide's workspace shape. It exists to
# provide native, networking-optional git functionality (repo discovery, ref resolution, object
# reading) without the CLI, GUI tools, fuzz targets, or full upstream dependency surface — see
# DIVERGENCE.md for the full rationale and provenance.
#
# What's gone, permanently, relative to upstream: the `gitoxide`/`ein` CLI binaries and their
# entire dependency tree (gitoxide-core, prodash, clap, and everything only they needed),
# gix-tui, gix-tix, gix-fsck, gix-lfs, gix-rebase, gix-sequencer, gix-macros, gix-note,
# gix-fetchhead, and both test harnesses (tests/it, tests/tools) and every crate's own tests/ and
# fuzz/ directories. None of it is needed to use `gix` as a library, and keeping it meant every
# build validated manifests for code nobody here uses or reviews.
#
# What's still here: 57 crates — the real dependency closure for
# `gix = { default-features = false, features = ["sha1", "revision"] }` (34 crates), plus the
# smaller set gix's own manifest declares as `optional = true` path dependencies and therefore
# requires to exist on disk even when unused (this includes the entire networking stack —
# gix-protocol, gix-transport, gix-credentials — present but NEVER compiled under this feature
# set; verify with `cargo tree`).
#
# Tracking upstream: `git remote add upstream https://github.com/GitoxideLabs/gitoxide.git`, then
# `git log <this-branch>..upstream/main -- <crate-name>/` shows what's changed in any specific
# crate since divergence, e.g. `git log local_profile..upstream/main -- gix-hash/` for anything
# that's landed in gix-hash since this fork split off. Pull in fixes deliberately, crate by crate,
# rather than re-merging the whole upstream tree.

[workspace]
resolver = "2"
members = [
    "gix",
    "tests/tools",
    "gix-actor",
    "gix-archive",
    "gix-attributes",
    "gix-bitmap",
    "gix-blame",
    "gix-chunk",
    "gix-command",
    "gix-commitgraph",
    "gix-config",
    "gix-config-value",
    "gix-credentials",
    "gix-date",
    "gix-diff",
    "gix-dir",
    "gix-discover",
    "gix-error",
    "gix-features",
    "gix-filter",
    "gix-fs",
    "gix-glob",
    "gix-hash",
    "gix-hashtable",
    "gix-ignore",
    "gix-imara-diff",
    "gix-index",
    "gix-lock",
    "gix-mailmap",
    "gix-merge",
    "gix-negotiate",
    "gix-object",
    "gix-odb",
    "gix-pack",
    "gix-packetline",
    "gix-path",
    "gix-pathspec",
    "gix-prompt",
    "gix-protocol",
    "gix-quote",
    "gix-ref",
    "gix-refspec",
    "gix-revision",
    "gix-revwalk",
    "gix-sec",
    "gix-shallow",
    "gix-status",
    "gix-submodule",
    "gix-tempfile",
    "gix-trace",
    "gix-transport",
    "gix-traverse",
    "gix-url",
    "gix-utils",
    "gix-validate",
    "gix-worktree",
    "gix-worktree-state",
    "gix-worktree-stream",
]

[workspace.dependencies]

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
gix-object = { opt-level = 3 }
gix-ref = { opt-level = 3 }
#gix-pack = { opt-level = 3 }
gix-hash = { opt-level = 3 }
gix-actor = { opt-level = 3 }
gix-config = { opt-level = 3 }
sha1-checked = { opt-level = 3 }
zlib-rs = { opt-level = 3 }

[profile.release]
overflow-checks = false
lto = "thin"
# This bloats files but assures destructors are called, important for tempfiles. One day I hope we
# can wire up the 'abrt' signal handler so tempfiles will be removed in case of panics.
panic = "unwind"
incremental = false

# This profile is currently used in building releases for GitHub.
# It may be removed at any time and should not otherwise be relied on.
[profile.release-github]
inherits = "release"
overflow-checks = false
panic = "unwind"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = 1
strip = "none"

[workspace.lints.rust]
# TODO: enable this
# unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

## Maybe one day we can enable these, unwrap and expect shouldn't be needed.
# unwrap_used      = "warn"
# expect_used      = "warn"
# panic            = "warn"
## This is a tough one - parsers are relying on it, but they check bounds before.
## Those can probably be rewritten to do the bounds-check via `get` and avoid len comparisons.
# indexing_slicing = "warn"
## This is about overflow/underflow and securing against this particularly with untrusted input.
## Very noisy and needs special care, probably better to focus on fuzzers instead to not pre-empt complexity.
# arithmetic_side_effects = "warn"

#
# Reviewed and allowed lints
needless_continue = "allow"
enum_glob_use = "allow"  # x97
missing_errors_doc = "allow"  # x1792
missing_panics_doc = "allow"  # x447
module_name_repetitions = "allow"  # x125
must_use_candidate = "allow"  # x1696
#
# Lints that we may want to forbid in the future
default_trait_access = "allow"  # x709
doc_markdown = "allow"  # x552
cast_possible_truncation = "allow"  # x216
needless_pass_by_value = "allow"  # x205
return_self_not_must_use = "allow"  # x204
unreadable_literal = "allow"  # x169
items_after_statements = "allow"  # x164
single_match_else = "allow"  # x162
too_many_lines = "allow"  # x161
unnecessary_wraps = "allow"  # x110
match_same_arms = "allow"  # x99
cast_lossless = "allow"  # x91
ignored_unit_patterns = "allow"  # x80
used_underscore_binding = "allow"  # x75
needless_raw_string_hashes = "allow"  # x75
implicit_clone = "allow"  # x70
manual_let_else = "allow"  # x64
cast_precision_loss = "allow"  # x56
trivially_copy_pass_by_ref = "allow"  # x43
redundant_else = "allow"  # x42
if_not_else = "allow"  # x37
match_wildcard_for_single_variants = "allow"  # x35
cast_sign_loss = "allow"  # x35
similar_names = "allow"  # x32
struct_excessive_bools = "allow"  # x29
cast_possible_wrap = "allow"  # x26
explicit_iter_loop = "allow"  # x24
explicit_into_iter_loop = "allow"  # x22
explicit_deref_methods = "allow"  # x22
inconsistent_struct_constructor = "allow"  # x18
range_plus_one = "allow"  # x17
inefficient_to_string = "allow"  # x14
from_iter_instead_of_collect = "allow"  # x13
unused_self = "allow"  # x10
many_single_char_names = "allow"  # x10
manual_string_new = "allow"  # x10
iter_not_returning_iterator = "allow"  # x10
option_option = "allow"  # x9
inline_always = "allow"  # x8
manual_assert = "allow"  # x7
iter_without_into_iter = "allow"  # x6
copy_iterator = "allow"  # x6
should_panic_without_expect = "allow"  # x5
transmute_ptr_to_ptr = "allow"  # x4
match_wild_err_arm = "allow"  # x4
manual_is_variant_and = "allow"  # x4
bool_to_int_with_if = "allow"  # x4
struct_field_names = "allow"  # x3
wildcard_imports = "allow"  # x2
needless_for_each = "allow"  # x2
naive_bytecount = "allow"  # x2
mut_mut = "allow"  # x2
match_bool = "allow"  # x2
fn_params_excessive_bools = "allow"  # x2
filter_map_next = "allow"  # x2
checked_conversions = "allow"  # x2
borrow_as_ptr = "allow"  # x2
unnecessary_join = "allow"  # x1
stable_sort_primitive = "allow"  # x1
no_effect_underscore_binding = "allow"  # x1
empty_docs = "allow"
too_long_first_doc_paragraph = "allow"
large_stack_arrays = "allow"

# Fix one day
result_large_err = "allow"
large_enum_variant = "allow"
